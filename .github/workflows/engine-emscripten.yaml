name: Engine Emscripten

on: push

env:
  BUILD_TYPE: Debug
  # The one build tree name; scripts/doriax-build-dir.bat carries the same
  # default, so CI and a developer's shell configure the same folder.
  DORIAX_BUILD_DIR: build
  TARGET: doriax-project

jobs:
  build:
    name: Build for Emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          # -y: apt-get prompts as soon as a dependency comes along, and there
          # is no stdin here to answer it.
          sudo apt-get install -y ninja-build cmake
          ninja --version
          cmake --version

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure
        run: |
          mkdir "$DORIAX_BUILD_DIR"
          mkdir instdir
          emcmake cmake \
            -S engine \
            -B "$DORIAX_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -G "Ninja" \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir

      - name: Build
        run: cmake --build "$DORIAX_BUILD_DIR" --config ${{env.BUILD_TYPE}} --target ${{env.TARGET}}
